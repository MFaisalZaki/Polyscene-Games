  - name: exit_graph_lints
    status: active
    source: design/gdd/scene-flow.md
    referenced_by:
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Chapter & Story Structure"
      - "Save/Load"
    variables:
      - G_c
      - path_len
      - chapter.beats
    output_range: "booleans SF-E1..E9 and SF-E4b"
    expression: "the chapter's exit graph is a DAG, every scene reachable, every entry-to-chapter_end path has length chapter.beats over authored and calendar scenes; sum of chapter.beats plus HORIZON_SLACK equals HORIZON_ACT"
    notes: "Formulas §2. Build gates owned by Scene Flow and listed in GDD 2 Rule 15's table."
    added: 2026-11-03
    revised: ""
  - name: stage_firings
    status: active
    source: design/gdd/scene-flow.md
    referenced_by:
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Chapter & Story Structure"
      - "Save/Load"
    variables:
      - fired
      - chapter_id
      - route
    output_range: "at most one insert; the rest paper (degraded[] in the trace)"
    expression: "fold over fired[] in selection order; admit(f) = [beat = insert] * [no insert yet] * [insert row exists for class in chapter] * [route != chapter_end] * [chapter != act_close]; everything else is paper"
    notes: "Formulas §3. GDD 6's presentation rule as a function: one insert then paper, never two inserts."
    added: 2026-11-03
    revised: ""
  - name: availability_derive
    status: active
    source: design/gdd/scene-flow.md
    referenced_by:
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Chapter & Story Structure"
      - "Save/Load"
    variables:
      - actions
      - filed_documents
      - has_fact_free_when
    output_range: "one of unfiled, filed, void, hidden per hotspot"
    expression: "void iff kind in {paper, object} and every has_fact-free action's when is false on the pre-boundary dossier; filed iff a document action's document is in filed_documents(); hidden never at MVP; else unfiled"
    notes: "Formulas §4. Derived at entry and after a load by one function; one synchronous in-scene path (document_filed)."
    added: 2026-11-03
    revised: ""
  - name: composite_apply
    status: active
    source: design/gdd/scene-flow.md
    referenced_by:
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Chapter & Story Structure"
      - "Save/Load"
    variables:
      - batch
    output_range: "dossier records then calendar records"
    expression: "partition by target: calendar.* to apply_calendar, else dossier.apply; returns D ++ K; calendar records are trace-only (projections empty)"
    notes: "Formulas §5. The apply Scene Flow injects into run_boundary."
    added: 2026-11-03
    revised: ""
  - name: boundary_record
    status: active
    source: design/gdd/scene-flow.md
    referenced_by:
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Chapter & Story Structure"
      - "Save/Load"
    variables:
      - beat
      - day
      - scene_id
      - chapter_id
      - fired
      - route
      - insert
      - paper
      - degraded
      - transition
      - snapshot_digest
    output_range: "one record per boundary; snapshot_digest = FNV-1a over the canonical BoundaryView"
    expression: "GDD 6's trace fields plus route, insert, paper, degraded, transition, snapshot_digest; StepResult {accepted, reason, at, boundary}"
    notes: "Formulas §6. Hash stability NOT SOURCEABLE: own FNV-1a with a Python twin."
    added: 2026-11-03
    revised: ""
  - name: paper_visible
    status: active
    source: design/gdd/scene-flow.md
    referenced_by:
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Chapter & Story Structure"
      - "Save/Load"
    variables:
      - firing
      - protagonist
      - projections
    output_range: "bool"
    expression: "paper_visible(f, p) = [p = none] + [exists r in f.changes : view(p) in r.projections]"
    notes: "Formulas §7. A paper beat the protagonist never sees renders nowhere in that chapter; Paper UI may take ownership (Open Questions)."
    added: 2026-11-03
    revised: ""
  - name: save_ok
    status: active
    source: design/gdd/scene-flow.md
    referenced_by:
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Chapter & Story Structure"
      - "Save/Load"
    variables:
      - state
      - staged
      - block_count
      - brackets
    output_range: "bool, true at exactly one instant per boundary"
    expression: "save_ok = [state = reveal closed] * [staged empty] * [no bracket open in dossier, calendar, facts] * [block count zero]; the load order L ends in calendar.open_chapter(chapter_id, resumed = true) then play_insert or enter"
    notes: "Formulas §8. The only save point."
    added: 2026-11-03
    revised: ""
