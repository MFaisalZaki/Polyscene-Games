# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

  - name: red_reach
    status: active
    source: design/gdd/calendar-regime-phase-attention.md
    referenced_by:
      - design/gdd/calendar-regime-phase-attention.md
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Overlay & Surveillance Rendering"
      - "Paper UI"
    variables:
      - red_band
      - phase
      - PHASE_RED_CAP
    output_range: "[0, 3]"
    expression: "red_reach(x) = min(red_band(x), PHASE_RED_CAP[phase])"
    notes: "Formulas §3. The tier Overlay draws for a person; phase is the ceiling, the person's band the fill. Act one never shows tier 3."
    added: 2026-11-03
    revised: ""
  - name: stamp_tier
    status: active
    source: design/gdd/calendar-regime-phase-attention.md
    referenced_by:
      - design/gdd/calendar-regime-phase-attention.md
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Overlay & Surveillance Rendering"
      - "Paper UI"
    variables:
      - red_reach
      - phase
      - PHASE_RED_CAP
    output_range: "[0, 3]"
    expression: "stamp_tier(x) = red_reach(x); ink_reach = PHASE_RED_CAP[phase]; invariant stamp_tier(x) <= ink_reach"
    notes: "Formulas §4. The surveillance stamp fill (hatched 0–1, half-struck 2, struck 3) and the HUD date stamp's ink reach (dry 0, crisp 1, bleeds 2, floods 3)."
    added: 2026-11-03
    revised: ""
  - name: date_for
    status: active
    source: design/gdd/calendar-regime-phase-attention.md
    referenced_by:
      - design/gdd/calendar-regime-phase-attention.md
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Overlay & Surveillance Rendering"
      - "Paper UI"
    variables:
      - d
      - W_open
      - W_start
      - PW_open
      - DOY_open
    output_range: "weekday 0–6; plan_week PW_open..PW_open+2; day of year within the act's year"
    expression: "weekday(d) = (W_open + d) mod 7; plan_week(d) = PW_open + floor(((W_open - W_start) mod 7 + d) / 7); day of year through a one-year month table"
    notes: "Formulas §5. ISO weeks, Monday start; the year bound is a build predicate (V10); no engine date routine."
    added: 2026-11-03
    revised: ""
  - name: transition_between
    status: active
    source: design/gdd/calendar-regime-phase-attention.md
    referenced_by:
      - design/gdd/calendar-regime-phase-attention.md
