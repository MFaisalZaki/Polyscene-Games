# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: scalar_apply
    status: active
    source: design/gdd/dossier-state-model.md
    referenced_by:
      - design/gdd/reactive-event-rules.md
      - design/gdd/dossier-state-model.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Filing & Decision"
      - "Dialogue & Interrogation"
    variables:
      - v
      - set
      - add_i
      - max_j
      - min_k
      - lo
      - hi
    output_range: "[lo, hi]"
    expression: "clamp(min(max(set ?? v + sum(add_i), max_j), min_k), lo, hi)"
    notes: "Formulas §1. One scalar per boundary batch; adds commute."
    added: 2026-11-03
    revised: ""
  - name: regime_stability
    status: active
    source: design/gdd/dossier-state-model.md
    referenced_by:
      - design/gdd/dossier-state-model.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Chapter & Story Structure"
    variables:
      - stability_0
      - hits
      - relief
      - beats_paranoid
      - DRIFT_PERIOD_STABILITY
    output_range: "[0, 10]"
    expression: "clamp(stability_0 - sum(hits) + sum(relief) - floor(beats_paranoid / DRIFT_PERIOD_STABILITY), 0, STABILITY_MAX)"
    notes: "Formulas §2."
    added: 2026-11-03
    revised: ""
  - name: regime_phase
    status: active
    source: design/gdd/dossier-state-model.md
    referenced_by:
      - design/gdd/dossier-state-model.md
      - design/gdd/calendar-regime-phase-attention.md
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Overlay & Surveillance Rendering"
      - "Audio & Adaptive Surveillance Mix"
      - "Reactive Event Rules & Story Simulator"
    variables:
      - phase_reached
      - stability
      - unrest
      - paranoid
    output_range: "[0, 3]"
    expression: "max(phase_reached, band(stability, unrest)); band = 3 if stability <= T_COLLAPSE and unrest >= U_COLLAPSE; 2 if stability <= T_PANIC and unrest >= U_CROWD; 1 if stability <= T_PARANOID or paranoid; else 0"
    notes: "Formulas §2. The Calendar owns the function; this GDD owns the aggregates and thresholds. Monotone by the phase_reached ratchet."
    added: 2026-11-03
    revised: ""
  - name: attention_effective
    status: active
    source: design/gdd/dossier-state-model.md
    referenced_by:
      - design/gdd/dossier-state-model.md
      - design/gdd/calendar-regime-phase-attention.md
      - design/gdd/scene-flow.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Overlay & Surveillance Rendering"
      - "Paper UI"
    variables:
      - attention
      - under_observation
      - phase
    output_range: "[0, ATTENTION_CAP]; red_band [0, 3]"
    expression: "clamp(attention + OBS_BONUS * [under_observation] + PHASE_BONUS * [phase >= 2], 0, ATTENTION_CAP); red_band = 0 if A_eff = 0, 1 if A_eff < ATTN_LOOK, 2 if A_eff <= ATTN_WATCHED, 3 otherwise"
    notes: "Formulas §3. red_band (none, margin, prop, light) feeds the stamp-red reach; never a float, never shown as a number."
    added: 2026-11-03
    revised: ""
  - name: broken_count
    status: active
    source: design/gdd/dossier-state-model.md
    referenced_by:
      - design/gdd/dossier-state-model.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Chapter & Story Structure"
    variables:
      - defiance_p
      - retraction_p
    output_range: "[0, 3]"
    expression: "sum over protagonists p of [OR(defiance_p) and not OR(retraction_p)]"
    notes: "Formulas §4. Lists are per-act chapter data."
    added: 2026-11-03
    revised: ""
  - name: ending_select
    status: active
    source: design/gdd/dossier-state-model.md
    referenced_by:
      - design/gdd/narrative-content-format.md
      - design/gdd/dossier-state-model.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Chapter & Story Structure"
      - "Reactive Event Rules & Story Simulator"
    variables:
      - phase
      - B
      - K_1..K_n
      - ENDING_TABLE_act
    output_range: "one ending class"
    expression: "first row r in ENDING_TABLE_act such that match(r, phase, B, K_1..K_n); last row is a declared fallback"
    notes: "Formulas §5. A fallback hit in a simulator run is a build failure."
    added: 2026-11-03
    revised: ""
  - name: flag_budget_ok
    status: active
    source: design/gdd/dossier-state-model.md
    referenced_by:
      - design/gdd/dossier-state-model.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Reactive Event Rules & Story Simulator"
      - "Chapter & Story Structure"
    variables:
      - R_c
      - W_c
      - X
    output_range: "bool"
    expression: "|R_c| <= READ_MAX and |W_c| <= WRITE_MAX and |R_c ∩ X| <= CROSS_READ_MAX and |W_c ∩ X| <= CROSS_WRITE_MAX"
    notes: "Formulas §6. Authoring gate; runtime log only."
    added: 2026-11-03
    revised: ""
  - name: payoff_reads
    status: active
    source: design/gdd/dossier-state-model.md
    referenced_by:
      - design/gdd/dossier-state-model.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Reactive Event Rules & Story Simulator"
      - "Chapter & Story Structure"
    variables:
      - R_c
      - X
      - last_source_protagonist
    output_range: "[0, CROSS_READ_MAX]"
    expression: "|{ f in R_c ∩ X : last_source_protagonist(f) not in {protagonist(c), null} }|"
    notes: "Formulas §7. Warning below CROSS_READ_MIN for every chapter after the first of an act."
    added: 2026-11-03
    revised: ""

