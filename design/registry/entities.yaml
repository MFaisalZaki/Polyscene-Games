  - name: id_ok
    status: active
    source: design/gdd/narrative-content-format.md
    referenced_by:
      - design/gdd/narrative-content-format.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Save/Load"
    variables:
      - id
      - SEG_MAX_LEN
      - ID_MAX_LEN
      - DOMAINS
    output_range: "bool"
    expression: "match(id, ID_RE) and cp(id) <= ID_MAX_LEN and dom(id) in DOMAINS and only the last segment all digits"
    notes: "Formulas §1. Grammar seg(.seg){2,4}, seg [a-z0-9][a-z0-9_]{0,23}."
    added: 2026-11-03
    revised: ""
  - name: len_eff
    status: active
    source: design/gdd/narrative-content-format.md
    referenced_by:
      - design/gdd/narrative-content-format.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Dialogue & Interrogation"
    variables:
      - s
      - p
      - worst(p)
      - LINE_CAP
      - LABEL_CAP
      - PROSE_WARN
      - PROSE_CAP
      - ANNOTATION_CAP
    output_range: "0..unbounded; 0 is an error"
    expression: "cp(strip_markup(s)) - sum cp({p}) + sum worst(p); cap_ok = len_eff <= min(CAP[kind], ANNOTATION_CAP if hand not typewriter)"
    notes: "Formulas §2. NFC code points, markup excluded, placeholders at worst case."
    added: 2026-11-03
    revised: ""
  - name: fit_hard
    status: active
    source: design/gdd/narrative-content-format.md
    referenced_by:
      - design/gdd/narrative-content-format.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
    variables:
      - s
      - L
      - len_en
      - len_L
      - max_chars
      - TARGET_LINE_HARD
      - TARGET_LABEL_HARD
      - expansion_band_L
    output_range: "bool"
    expression: "len_eff(s_L) <= min(hard(kind), max_chars); budget(L,n) = max(ceil(b(L,n)*n), [n>20]*ceil(b1*20), [n>60]*ceil(b2*60)); expansion_ok = len_L <= budget"
    notes: "Formulas §3. Band envelope is monotone; band is advisory, container is law."
    added: 2026-11-03
    revised: ""
  - name: object_complete
    status: active
    source: design/gdd/narrative-content-format.md
    referenced_by:
      - design/gdd/narrative-content-format.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Paper UI"
      - "Dialogue & Interrogation"
      - "Settings Store"
    variables:
      - obj
      - L
      - strings(obj)
      - owner(s)
    output_range: "bool; locale_coverage 0.0..1.0"
    expression: "all s in strings(obj): defined(L,s) and placeholders equal and fit_hard; text(s,L) = L[s] if object_complete(owner(s),L) else en[s] else <<id>>"
    notes: "Formulas §5. Fallback is per content object, never per string; never blank."
    added: 2026-11-03
    revised: ""
  - name: beat_coverage
    status: active
    source: design/gdd/narrative-content-format.md
    referenced_by:
      - design/gdd/narrative-content-format.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Reactive Event Rules & Story Simulator"
      - "Chapter & Story Structure"
    variables:
      - W_action
      - W_event
      - W_ending
      - beat(c)
      - epilogue(e)
    output_range: "0.0..1.0; must be 1.0"
    expression: "|{c : beat(c) and paper(beat(c))}| / |W_action ∪ W_event|; epilogue_coverage over W_ending ∪ {act_fallback}"
    notes: "Formulas §6. Joined against world_classes.json from the polyscene topic."
    added: 2026-11-03
    revised: ""
  - name: content_budget_contribution
    status: active
    source: design/gdd/narrative-content-format.md
    referenced_by:
      - design/gdd/narrative-content-format.md
    planned_consumers:   # GDDs not yet written; move to referenced_by when they cite this
      - "Reactive Event Rules & Story Simulator"
      - "Filing & Decision"
      - "Dialogue & Interrogation"
    variables:
      - conds(c)
      - docs(c)
      - R_c^rules
      - W_c^rules
      - fields_in
    output_range: "sets 0..schema size"
